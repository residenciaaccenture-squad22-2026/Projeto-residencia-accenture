# PostgreSQL/Supabase
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.datasource.devservices.enabled=false

# Front-end separado via HTTP
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Variaveis do Supabase
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}

# Os testes atuais validam apenas o endpoint de exemplo e nao precisam de banco.
%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.datasource.devservices.enabled=false
