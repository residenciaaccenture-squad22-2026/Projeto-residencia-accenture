# PostgreSQL/Supabase
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate

# Migracoes de banco
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration/postgresql

# Front-end separado via HTTP
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Documentacao da API
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Agente IA: placeholder em dev/test para permitir evoluir o backend sem chave real.
%dev.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:dev-placeholder-key}
%test.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:test-placeholder-key}
%prod.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
planta.reconhecimento.model=${OPENAI_VISION_MODEL:gpt-4.1-mini}
planta.reconhecimento.max-output-tokens=${OPENAI_VISION_MAX_OUTPUT_TOKENS:1800}
planta.reconhecimento.image-detail=${OPENAI_VISION_IMAGE_DETAIL:low}

# Banco em memoria para testes automatizados.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:residencia;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=db/migration/h2

# Desenvolvimento e producao
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.flyway.migrate-at-start=true
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true
