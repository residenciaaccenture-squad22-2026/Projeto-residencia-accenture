services:
  api:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: residencia-accenture-api:latest
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
